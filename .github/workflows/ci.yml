name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enforce workflow security policy
        run: python3 .github/scripts/check_workflow_security.py
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23"
      - name: Gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo "run gofmt -w" && exit 1)
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Release helper syntax
        run: bash -n scripts/verify-generate-service-release.sh
      - name: Test
        run: go test ./...
      - name: Determinism (same seed, same hash across two separate runs)
        run: |
          go build -o /tmp/generate ./cmd/generate
          a=$(/tmp/generate -bench-version 2 -seed 123456789 -run-size full -sha 2>/dev/null)
          b=$(/tmp/generate -bench-version 2 -seed 123456789 -run-size full -sha 2>/dev/null)
          echo "run1=$a"
          echo "run2=$b"
          if [ "$a" != "$b" ]; then echo "generator is not deterministic"; exit 1; fi
      - name: Cross-architecture reproducibility (GOARCH=386 known vector)
        run: GOARCH=386 go test ./gen -run TestKnownVector -count=1
