# Build + push the generate-service image to Artifact Registry.
#
# The Artifact Registry repo + the Cloud Run service that consumes this image
# live in the infra repo's Terraform (terraform/envs/gcp-platform/
# datapipeline.tf). Build from a CHECKED-OUT RELEASE TAG and tag the image with
# it, so the deployed generator provably matches the public reproduction CLI at
# that version and a rollback is a tag change, not a rebuild.
#
# Usage (from the REPO ROOT at the release tag, project already selected):
#   gcloud builds submit \
#     --config cmd/generate-service/cloudbuild.yaml \
#     --substitutions=_IMAGE=us-central1-docker.pkg.dev/PROJECT/datapipeline/generate:v0.7.1

substitutions:
  _IMAGE: "REPLACE_WITH_ARTIFACT_REGISTRY_IMAGE"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}
      - --file=cmd/generate-service/Dockerfile
      - .

images:
  - "${_IMAGE}"

timeout: 900s
